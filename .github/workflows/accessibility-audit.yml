name: Accessibility Audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  accessibility-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run accessibility audit
        run: python scripts/check_accessibility.py
