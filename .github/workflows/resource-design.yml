name: Resource Design Publication
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/resource_design.py', 'scripts/test_resource_design.py', 'src/resource-design.css', 'src/resource-preview.js', 'data/resource-previews.json', 'seo/resource-design-context.json', '.github/workflows/resource-design.yml']
permissions:
  contents: read
concurrency:
  group: resource-design-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply approved resource design
        run: |
          python scripts/resource_design.py
          python scripts/build_library_catalog.py
          python scripts/resource_design.py
      - name: Verify original records and publication scope
        run: |
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          allowed = {'kutuphane.html', 'seo/approved-edits.json'}
          invalid = [name for name in changed if name not in allowed and not (name.endswith('/index.html') and name.startswith(('kaynak/', 'kaynak-detay/', 'kutuphane/katalog/')))]
          if invalid: raise ValueError('Unexpected publication changes: '+str(invalid))
          PY
      - name: Check design, search, sources and preservation
        run: |
          python -m unittest discover -s scripts -p test_resource_design.py
          python -m unittest discover -s scripts -p test_resource_publication.py
          python scripts/test_seo_engine.py
          python scripts/test_ecosystem_engine.py
          node --test tests/*.mjs
          python scripts/build_library_catalog.py --check
          python scripts/check_seo.py
          python scripts/check_accessibility.py
          python scripts/check_frontend_secrets.py
      - name: Commit verified resource pages
        id: pages
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add kutuphane.html kaynak/ kaynak-detay/ kutuphane/katalog/ seo/approved-edits.json
            git commit -m 'Apply compact resource layouts and source-specific usage guidance'
            git push origin HEAD:main
            echo 'published=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish verified Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/{owner}/{repo}/pages/builds
