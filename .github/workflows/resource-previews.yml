name: Real Resource Previews
on:
  workflow_dispatch:
  schedule:
    - cron: '35 * * * *'
  push:
    branches: [main]
    paths: ['data/collected-resources.json', 'scripts/build_resource_previews.py', '.github/workflows/resource-previews.yml']
permissions:
  contents: write
concurrency:
  group: resource-design-publication
  cancel-in-progress: false
jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils fonts-dejavu-core
          pip install openpyxl Pillow pypdf
      - name: Render original public documents
        run: python scripts/build_resource_previews.py --limit 100
      - name: Update catalogue covers
        run: |
          python scripts/resource_design.py
          python scripts/build_library_catalog.py
          python scripts/resource_design.py
          python -m unittest discover -s scripts -p test_resource_design.py
          python scripts/build_library_catalog.py --check
          python scripts/check_seo.py
          python scripts/check_accessibility.py
      - name: Preserve original resource records
        run: |
          test -z "$(git diff --name-only -- data/library.json data/forms.json data/collected-resources.json db src/auth-config.js)"
      - name: Publish actual previews
        run: |
          git add data/resource-previews.json data/preview-build-state.json assets/resource-previews/ kutuphane.html kaynak/ kaynak-detay/ kutuphane/katalog/ seo/approved-edits.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Add genuine document covers and spreadsheet previews'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build live Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/{owner}/{repo}/pages/builds
