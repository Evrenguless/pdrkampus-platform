name: Official Resource Collector
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['collector/**', 'scripts/collect_resources.py', 'scripts/test_collect_resources.py', '.github/workflows/resource-collector.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: resource-collector-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_collect_resources.py
  collect:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore the most recent queue from this workflow on the default branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = context.payload.repository.default_branch;
            const {data} = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'resource-collector.yml', branch,
              status: 'completed', per_page: 10
            });
            for (const run of data.workflow_runs) {
              if (run.id === context.runId) continue;
              const result = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: run.id
              });
              const artifact = result.data.artifacts.find(a => a.name === 'official-resource-review' && !a.expired);
              if (!artifact) continue;
              const download = await github.rest.actions.downloadArtifact({
                ...context.repo, artifact_id: artifact.id, archive_format: 'zip'
              });
              fs.writeFileSync(`${process.env.RUNNER_TEMP}/collector-previous.zip`, Buffer.from(download.data));
              core.info(`Restored queue from run ${run.id}`);
              break;
            }
      - name: Read only state.json from the queue archive
        run: |
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          archive = root / 'collector-previous.zip'
          if archive.exists():
              with zipfile.ZipFile(archive) as z:
                  info = z.getinfo('state.json')
                  if info.file_size > 30000000:
                      raise ValueError('Previous queue exceeds size limit')
                  (root / 'collector-previous.json').write_bytes(z.read(info))
          PY
      - name: Collect public learning resources into the review queue
        run: python scripts/collect_resources.py --previous "$RUNNER_TEMP/collector-previous.json" --output "$RUNNER_TEMP/official-resource-review"
      - name: Keep the queue and review exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-resource-review
          path: ${{ runner.temp }}/official-resource-review
          retention-days: 90
          if-no-files-found: warn
      - name: Show collection results
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ['RUNNER_TEMP']) / 'official-resource-review/report.json'
          if report.exists():
              r = json.loads(report.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write(f"## Kaynak toplama\n\nTaranan sayfa: {r['visited_pages']}\n\nYeni aday: {r['new_candidates']}\n\nDosya kontrolü: {r['file_checks']}\n\n")
                  for status, count in r['statuses'].items():
                      out.write(f"- {status}: {count}\n")
                  out.write('\nİnceleme için official-resource-review paketindeki index.html dosyasını açın.\n')
          PY
