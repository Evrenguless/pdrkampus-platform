name: SEO Audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify generated resource catalog
        run: python scripts/build_library_catalog.py --check
      - name: Run SEO audit
        run: python scripts/check_seo.py

